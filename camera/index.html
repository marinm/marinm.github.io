<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/camera/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Camera</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    #message {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font: inherit;
      font-size: 1.25rem;
      cursor: pointer;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100lvh;
      object-fit: cover;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <button id="message" type="button">Tap to allow camera</button>
  <video id="video" autoplay muted playsinline hidden></video>

  <script>
    const message = document.getElementById("message");
    const video = document.getElementById("video");

    message.addEventListener("click", async () => {
      try {
        video.srcObject = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false,
        });
        await video.play();
        message.hidden = true;
        video.hidden = false;
      } catch (error) {
        const denied = error.name === "NotAllowedError" || error.name === "SecurityError";
        message.textContent = denied ? "Permission not granted" : "Camera unavailable";
      }
    });
  </script>
</body>
</html>
