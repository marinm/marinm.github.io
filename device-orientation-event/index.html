<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100dvw;
            height: 100dvh;
        }

        #container {
            max-width: 320px;
            box-sizing: border-box;
            padding: 1em;
        }

        .font-mono {
            font-family: monospace;
        }

        .text-right {
            text-align: right;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="not-available-content" class="hidden">
            <!-- Error message here -->
        </div>
        <div id="request-permission">
            Tap to enable device orientation
        </div>
        <div id="available-content" class="hidden">
            <table>
                <thead>
                    <tr>
                        <th>Variable</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>absolute</td>
                        <td class="font-mono text-right">
                            <div data-name="absolute"></div>
                        </td>
                    </tr>
                    <tr>
                        <td>alpha</td>
                        <td class="font-mono text-right">
                            <div data-name="alpha"></div>
                        </td>
                    </tr>
                    <tr>
                        <td>beta</td>
                        <td class="font-mono text-right">
                            <div data-name="beta"></div>
                        </td>
                    </tr>
                    <tr>
                        <td>gamma</td>
                        <td class="font-mono text-right">
                            <div data-name="gamma"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function $(selector) {
            return document.querySelector(selector);
        }

        function show(selector) {
            $(selector).classList.remove('hidden');
        }

        function hide(selector) {
            $(selector).classList.add('hidden');
        }

        function setError(message) {
            show('#not-available-content');
            hide('#request-permission');
            hide('#available-content');

            $('#not-available-content').innerText = message;
        }

        function showAvailable() {
            hide('#not-available-content');
            hide('#request-permission');
            show('#available-content');
        }

        function onDeviceorientation(event) {
            $('div[data-name="absolute"]').innerHTML = event.absolute;
            $('div[data-name="alpha"]').innerHTML = Number(event.alpha).toFixed(2);
            $('div[data-name="beta"]').innerHTML = Number(event.beta).toFixed(2);
            $('div[data-name="gamma"]').innerHTML = Number(event.gamma).toFixed(2);
        }

        async function requestPermission() {
            const permission = await DeviceOrientationEvent.requestPermission();
            return permission == "granted";
        }

        async function onRequestPermissionClick() {
            const permissionGranted = await requestPermission();

            if (!permissionGranted) {
                setError("Permission not granted");
                return;
            }

            showAvailable();

            window.addEventListener("deviceorientation", onDeviceorientation);
        }

        function showRequestPermission() {
            hide('#not-available-content');
            show('#request-permission');
            hide('#available-content');

            $('#request-permission').addEventListener("click", onRequestPermissionClick);
        }

        function init() {
            if (!("DeviceOrientationEvent" in window)) {
                setError("Hardware not supported");
                return;
            }

            if (!("requestPermission" in window.DeviceOrientationEvent)) {
                setError("Hardware not supported");
                return;
            }

            showRequestPermission();
        }

        init();
    </script>
</body>

</html>
