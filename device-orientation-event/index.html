<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100dvw;
            height: 100dvh;
        }

        #container {
            max-width: 320px;
            box-sizing: border-box;
            padding: 1em;
        }

        .font-mono {
            font-family: monospace;
        }

        .text-right {
            text-align: right;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="not-available-content" class="hidden">
            Hardware not supported
        </div>
        <div id="available-content" class="hidden">
            <table>
                <thead>
                    <tr>
                        <th>Variable</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>absolute</td>
                        <td class="font-mono text-right">
                            <div data-name="absolute"></div>
                        </td>
                    </tr>
                    <tr>
                        <td>alpha</td>
                        <td class="font-mono text-right">
                            <div data-name="alpha"></div>
                        </td>
                    </tr>
                    <tr>
                        <td>beta</td>
                        <td class="font-mono text-right">
                            <div data-name="beta"></div>
                        </td>
                    </tr>
                    <tr>
                        <td>gamma</td>
                        <td class="font-mono text-right">
                            <div data-name="gamma"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        function $(selector) {
            return document.querySelector(selector);
        }

        function showNotAvailable() {
            $('#not-available-content').classList.remove('hidden');
            $('#available-content').classList.add('hidden');
        }

        function showAvailable() {
            $('#not-available-content').classList.add('hidden');
            $('#available-content').classList.remove('hidden');
        }

        if ("DeviceOrientationEvent" in window) {
            if ("requestPermission" in window.DeviceOrientationEvent) {
                showAvailable();

                setMessage("DeviceOrientationEvent available, requestPermission available. Tap to allow 'deviceorientation' events.");
                document.body.addEventListener("click", async (event) => {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission == "granted") {
                        setMessage("DeviceOrientationEvent permission granted");
                        window.addEventListener("deviceorientation", onDeviceorientation);
                    } else {
                        setMessage("DeviceOrientationEvent permission not granted");
                    }
                });
            } else {
                showNotAvailable();
            }
        } else {
            showNotAvailable();
        }

        function onDeviceorientation(event) {
            $('div[data-name="absolute"]').innerHTML = event.absolute;
            $('div[data-name="alpha"]').innerHTML = Number(event.alpha).toFixed(2);
            $('div[data-name="beta"]').innerHTML = Number(event.beta).toFixed(2);
            $('div[data-name="gamma"]').innerHTML = Number(event.gamma).toFixed(2);
        }
    </script>
</body>

</html>
