<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Remote Device Orientation Receiver</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        background: #000;
        color: #fff;
        font-family: monospace;
      }
      #code {
        margin: 0 0 1.5rem;
        font-size: 3rem;
        text-align: center;
      }
      .client {
        margin-bottom: 1rem;
        overflow-wrap: anywhere;
      }
      .values {
        font-size: 1.25rem;
      }
      .scene {
        --width: 120px;
        --height: 253px;
        --depth: 8px;
        --radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 320px;
        perspective: 800px;
      }
      .camera {
        transform-style: preserve-3d;
        transform: rotateX(45deg);
      }
      .phone {
        position: relative;
        width: var(--width);
        height: var(--height);
        transform-style: preserve-3d;
      }
      .phone div {
        position: absolute;
      }
      .front,
      .back,
      .edge {
        inset: 0;
        border-radius: var(--radius);
      }
      .front {
        background: green;
        transform: translateZ(calc(var(--depth) / 2));
      }
      .front::after {
        content: "";
        position: absolute;
        left: 20%;
        top: 30%;
        width: 60%;
        height: 40%;
        background: #fff;
        clip-path: polygon(50% 0, 100% 40%, 70% 40%, 70% 100%, 30% 100%, 30% 40%, 0 40%);
      }
      .back {
        background: #333;
        transform: rotateY(180deg) translateZ(calc(var(--depth) / 2));
      }
      .edge {
        background: gray;
      }
    </style>
  </head>
  <body>
    <h1 id="code"></h1>
    <div id="clients"></div>

    <script>
      const code = String(Math.floor(Math.random() * 10000)).padStart(4, "0");
      const channel = `remote-device-orientation-${code}`;
      const url = `wss://broadcast.marinm.net/?channel=${channel}`;
      const RETRY_MS = 3000;
      const EDGE_SLICES = 15;

      const clientsElement = document.getElementById("clients");
      const clients = new Map();
      let ownId = null;

      document.getElementById("code").textContent = code;

      function createFace(className) {
        const face = document.createElement("div");
        face.className = className;
        return face;
      }

      function addClient(id) {
        const element = document.createElement("div");
        element.className = "client";
        const title = document.createElement("div");
        title.textContent = id;
        const values = document.createElement("div");
        values.className = "values";
        const scene = document.createElement("div");
        scene.className = "scene";
        const phone = document.createElement("div");
        phone.className = "phone";
        phone.append(createFace("front"), createFace("back"));
        // Stacked slices between front and back form the rounded edge
        for (let i = 1; i <= EDGE_SLICES; i++) {
          const slice = createFace("edge");
          const offset = i / (EDGE_SLICES + 1) - 0.5;
          slice.style.transform = `translateZ(calc(var(--depth) * ${offset}))`;
          phone.append(slice);
        }
        const camera = document.createElement("div");
        camera.className = "camera";
        camera.append(phone);
        scene.append(camera);
        element.append(title, values, scene);
        clientsElement.append(element);
        clients.set(id, { element, values, phone });
      }

      function removeClient(id) {
        clients.get(id).element.remove();
        clients.delete(id);
      }

      function updatePresent(present) {
        for (const id of clients.keys()) {
          if (!present.includes(id)) removeClient(id);
        }
        for (const id of present) {
          if (id !== ownId && !clients.has(id)) addClient(id);
        }
      }

      function isOrientation(data) {
        return (
          data !== null &&
          typeof data === "object" &&
          ["alpha", "beta", "gamma"].every((key) => typeof data[key] === "number")
        );
      }

      function handleMessage(message) {
        if (message.from === "server") {
          ownId = message.connection_id;
          if (Array.isArray(message.data?.present)) {
            updatePresent(message.data.present);
          }
          return;
        }
        const client = clients.get(message.from);
        if (client && isOrientation(message.data)) {
          const { alpha, beta, gamma } = message.data;
          client.values.textContent = [alpha, beta, gamma]
            .map((value) => value.toFixed(1))
            .join(", ");
          // W3C order Rz(alpha) Rx(beta) Ry(gamma), with CSS's y axis pointing down
          client.phone.style.transform = `rotateZ(${-alpha}deg) rotateX(${-beta}deg) rotateY(${gamma}deg)`;
        }
      }

      function connect() {
        const socket = new WebSocket(url);
        socket.onmessage = (event) => {
          try {
            handleMessage(JSON.parse(event.data));
          } catch {
            // Ignore invalid messages
          }
        };
        socket.onclose = () => {
          updatePresent([]);
          setTimeout(connect, RETRY_MS);
        };
      }

      connect();
    </script>
  </body>
</html>
