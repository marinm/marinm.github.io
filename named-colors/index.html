<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Named colors</title>
    <style>
        body {
            text-align: center;
            padding: 0;
            margin: 0;
        }

        .colors {
            font-family: monospace;
        }

        .color {
            display: grid;
            grid-template-columns: 24ch 10ch;
            justify-content: center;
            padding: 4ch 2ch;
            text-align: left;
        }

        .hex {
            text-align: right;
            font-family: monospace;
        }
    </style>
</head>

<body>

      --   https://developer.mozilla.org/en-US/docs/Web/CSS/named-color

            { name: "palevioletred", hex: "#db7093" },
            { name: "crimson", hex: "#dc143c" },
            { name: "pink", hex: "#ffc0cb" },
            { name: "lightpink", hex: "#ffb6c1" },
        ];

        const colorsDiv = document.querySelector(".colors");

        colors.forEach((color) => colorsDiv.appendChild(colorRow(color)));

        function colorRow({ name, hex }) {
            const rowDiv = document.createElement("div");
            rowDiv.classList.add("color");
            rowDiv.style.backgroundColor = name;
            rowDiv.style.color = textColor(hex);

            const nameDiv = document.createElement("div");
            nameDiv.innerText = name;

            const hexDiv = document.createElement("div");
            hexDiv.classList.add("hex");
            hexDiv.innerText = hex;

            rowDiv.appendChild(nameDiv);
            rowDiv.appendChild(hexDiv);

            return rowDiv;
        }

        // Picks black or white, whichever has the higher WCAG contrast ratio
        function textColor(hex) {
            const [r, g, b] = [1, 3, 5].map((i) => {
                const channel = parseInt(hex.slice(i, i + 2), 16) / 255;
                return channel <= 0.03928 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4;
            });
            const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;

            // Contrast with black is (L + 0.05) / 0.05; with white, 1.05 / (L + 0.05)
            return luminance > Math.sqrt(1.05 * 0.05) - 0.05 ? "black" : "white";
        }
